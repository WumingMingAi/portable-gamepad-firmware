# Controller side: ESB (2.4GHz) transport + transport switch + platform hotkey
CONFIG_ESB=y
CONFIG_ESB_CLOCK_INIT=y

# Run ESB through MPSL timeslots so it can coexist (at build and runtime
# level) with the BLE softdevice controller in the same image. Mirrors the
# official esb_prx_ble coexistence sample.
CONFIG_ESB_MPSL_TIMESLOT=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2

CONFIG_PGF_TRANSPORT_SWITCH=y

CONFIG_PGF_PLATFORM_HOTKEY=y
CONFIG_PGF_PLATFORM_HOTKEY_HOLD_MS=5000

# Default to PC (XInput) platform on first boot
CONFIG_PGF_INPUT_MODE_DEFAULT=3
